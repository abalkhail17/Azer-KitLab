word</label><input id="kl-pass" type="password" required autocomplete="current-password" placeholder="Enter your password"><button class="kl-submit" type="submit">Sign in →</button></form><div class="kl-err" id="kl-error"></div></div><div class="kl-foot">azer / KitLab &nbsp; V1 <span style="float:right">UNDER TESTING</span></div></div></div><script id="kitlab-netlify-auth">(function(){
